<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Admin - Hệ thống cổng thông tin việc làm" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  <aside class="sidebar">
    <h2>Admin Panel</h2>
    <nav>
      <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('admin.users') }}">Users</a>
      <a href="{{ url_for('admin.companies') }}">Companies</a>
      <a href="{{ url_for('admin.jobs') }}">Jobs</a>
      <a href="{{ url_for('admin.applications') }}">Applications</a>
      <a href="{{ url_for('admin.categories') }}">Categories</a>
      <a href="{{ url_for('admin.tags') }}">Tags</a>
      <a href="{{ url_for('admin.logout') }}">Logout</a>
    </nav>
  </aside>
  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
